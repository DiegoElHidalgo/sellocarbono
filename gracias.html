<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>¡Mensaje recibido! – ATMOS SPA</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="header header--scrolled">
    <div class="container header__inner">
      <a href="/" class="logo">
        <svg class="logo__icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="#2d7a45"/>
          <path d="M20 8C13.4 8 8 13.4 8 20s5.4 12 12 12 12-5.4 12-12S26.6 8 20 8zm0 2c5.5 0 10 4.5 10 10S25.5 30 20 30 10 25.5 10 20 14.5 10 20 10z" fill="white" opacity="0.3"/>
          <path d="M20 12c-1.5 3-4 5-7 6 0 5.5 3 9 7 10 4-1 7-4.5 7-10-3-1-5.5-3-7-6z" fill="white"/>
        </svg>
        <span class="logo__text">ATMOS SPA</span>
      </a>
    </div>
  </header>

  <section class="gracias">
    <div class="container gracias__inner">
      <div class="gracias__icon">✅</div>
      <h1 class="gracias__title">¡Mensaje recibido!</h1>
      <p class="gracias__subtitle">Gracias por contactarnos. Te responderemos en menos de <strong>24 horas hábiles</strong> con toda la información sobre tu certificación HuellaChile.</p>

      <div class="gracias__divider">
        <span>¿Necesitas atención inmediata?</span>
      </div>

      <div class="gracias__actions">
        <a href="https://wa.me/56984335211?text=Hola%2C%20acabo%20de%20completar%20el%20formulario%20en%20sellocarbono.cl%20y%20quisiera%20hablar%20con%20un%20experto." class="gracias__btn gracias__btn--whatsapp" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Escríbenos por WhatsApp
        </a>
        <a href="https://calendar.app.google/nQ89Q3jcxziD949r9" class="gracias__btn gracias__btn--calendar" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Agenda una reunión ahora
        </a>
      </div>

      <a href="/" class="gracias__back">← Volver al inicio</a>
    </div>
  </section>

  <style>
    body { background: var(--gray-50); }

    .gracias {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      padding: 80px 0 60px;
    }

    .gracias__inner {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .gracias__icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .gracias__title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      color: var(--gray-900);
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .gracias__subtitle {
      font-size: 1.05rem;
      color: var(--gray-500);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .gracias__divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .gracias__divider::before,
    .gracias__divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    .gracias__divider span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gray-500);
      white-space: nowrap;
    }

    .gracias__actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 36px;
    }

    .gracias__btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 28px;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all var(--transition);
    }

    .gracias__btn--whatsapp {
      background: #25d366;
      color: white;
    }

    .gracias__btn--whatsapp:hover {
      background: #1ebe5d;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37,211,102,0.35);
    }

    .gracias__btn--calendar {
      background: var(--white);
      color: var(--green-700);
      border: 2px solid var(--green-700);
    }

    .gracias__btn--calendar:hover {
      background: var(--green-100);
      transform: translateY(-2px);
    }

    .gracias__back {
      font-size: 0.9rem;
      color: var(--gray-500);
      text-decoration: none;
      transition: color var(--transition);
    }

    .gracias__back:hover { color: var(--green-700); }
  </style>
</body>
</html>
